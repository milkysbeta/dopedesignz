<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop — The Awakening Process</title>
<meta name="description" content="Every design in the current range, on tees, hoodies, jackets and hats. Printed to order in Aotearoa New Zealand.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="shop" data-base="">

<header data-site-header></header>

<main class="wrap section section--tight" data-catalog-error>

  <div class="section-head">
    <div>
      <p class="eyebrow">The range</p>
      <h1 class="h1">Shop</h1>
    </div>
    <p class="meta" data-result-count></p>
  </div>

  <div style="display:grid;gap:1rem;margin-bottom:2.5rem">
    <div class="filters" data-filter-garment role="group" aria-label="Filter by garment"></div>
    <div class="filters" data-filter-collection role="group" aria-label="Filter by collection"></div>
  </div>

  <div class="grid grid--3" data-shop-grid>
    <p class="meta">Loading the range&hellip;</p>
  </div>

</main>

<footer data-site-footer></footer>

<script src="assets/js/config.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/garments.js"></script>
<script src="assets/js/page-shop.js"></script>
</body>
</html>
