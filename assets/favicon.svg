<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Tab mark: the collapsing ring motif from the Liquid Chrome range,
       reduced until it still reads at 16px. -->
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fe8ff"/>
      <stop offset="0.5" stop-color="#b9a6ff"/>
      <stop offset="1" stop-color="#ff9ecb"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#08090b"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#chrome)" stroke-width="2.5" opacity="0.55"/>
  <circle cx="32" cy="32" r="13" fill="none" stroke="url(#chrome)" stroke-width="2.5" opacity="0.8"/>
  <circle cx="32" cy="32" r="5.5" fill="url(#chrome)"/>
</svg>
